name: Create pNES v7.1 Turbo Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from official pEMU v7.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching official pEMU v7.1..."

          git fetch \
            https://github.com/Cpasjuste/pemu.git \
            refs/tags/v7.1:refs/tags/upstream-v7.1

          git checkout -B pnes-v7.1-turbo refs/tags/upstream-v7.1

          echo "Branch created from:"
          git log -1 --oneline

          echo "Pushing branch to my fork..."

          git push \
            origin \
            pnes-v7.1-turbo:pnes-v7.1-turbo
