name: Build pFBNeo Switch

on:
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update FBNeo core for PGM2
        run: |
          cd "$GITHUB_WORKSPACE/external/cores/FBNeo"
          git fetch --depth=1 origin 5bb235d2f582d2cc7e59d8dfb1cbaaca4d146f3d
          git checkout --detach 5bb235d2f582d2cc7e59d8dfb1cbaaca4d146f3d
          test -f src/burn/drv/pgm2/d_pgm2.cpp
          grep -q "HARDWARE_IGS_PGM2" src/burn/burn.h

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip

      - name: Install "fixed" libmpv
        run: |
          wget https://github.com/Cpasjuste/pacman-packages/releases/download/switch-libmpv-lua-fix/switch-libmpv-0.39.0-3-any.pkg.tar.zst
          sudo dkp-pacman -U --noconfirm switch-libmpv-0.39.0-3-any.pkg.tar.zst

      - name: Configure
        run: |
          cd $GITHUB_WORKSPACE
          mkdir cmake-build
          cd cmake-build
          cmake -G "Unix Makefiles" \
            -DPLATFORM_SWITCH=ON \
            -DCMAKE_BUILD_TYPE=Release \
            ..

      - name: Build pFBNeo dependencies
        run: |
          cd $GITHUB_WORKSPACE/cmake-build
          make pfbneo.deps

      - name: Build pFBNeo
        run: |
          cd $GITHUB_WORKSPACE/cmake-build
          make pfbneo.nro
          mv src/cores/pfbneo/pfbneo.nro $GITHUB_WORKSPACE/pfbneo.nro

      - name: Upload pFBNeo
        uses: actions/upload-artifact@v4
        with:
          name: pFBNeo-Switch
          path: pfbneo.nro
